# Resolved at run time. Three runs; they differ only under models.<name>.layer_pattern.
training_config:
  training:
    seed: 1337
    max_steps: 300
    batch_size: 16
    grad_accum_steps: 4
    seq_len: 256
    optimizer:
      type: adamw
      lr: 0.001
      betas:
      - 0.9
      - 0.95
      weight_decay: 0.1
      eps: 1.0e-08
      grad_clip: 1.0
    schedule:
      type: cosine
      warmup_steps: 30
      min_lr_ratio: 0.1
    precision:
      dtype: bfloat16
      grad_dtype: float32
    device: auto
    compile: false
  data:
    config: configs/data/tinystories.yaml
  logging:
    backend: jsonl
    out_dir: runs/tinystories-<model>
    log_every: 100
    eval_every: 100
    eval_batches: 20
    checkpoint_every: 300
data_config: configs/data/tinystories.yaml (fingerprint 14e0193c1cf98866)
models:
  dense:
    d_model: 256
    n_layers: 8
    vocab_size: 50304
    max_seq_len: 256
    layer_pattern:
    - mixer: full_attention
      pos: rope
      heads: 8
      kv_heads: 2
    mlp:
      type: swiglu
      hidden_mult: 4.0
    norm:
      type: rmsnorm
      eps: 1.0e-05
    rope:
      layout: half
      base: 10000.0
    pos: null
    tie_embeddings: true
    scale_residual_init: true
    tier: reference
  swa:
    d_model: 256
    n_layers: 8
    vocab_size: 50304
    max_seq_len: 256
    layer_pattern:
    - mixer: sliding_window
      pos: rope
      heads: 8
      kv_heads: 2
      window: 64
    mlp:
      type: swiglu
      hidden_mult: 4.0
    norm:
      type: rmsnorm
      eps: 1.0e-05
    rope:
      layout: half
      base: 10000.0
    pos: null
    tie_embeddings: true
    scale_residual_init: true
    tier: reference
  swa-hybrid:
    d_model: 256
    n_layers: 8
    vocab_size: 50304
    max_seq_len: 256
    layer_pattern:
    - mixer: sliding_window
      pos: rope
      heads: 8
      kv_heads: 2
      window: 64
    - mixer: sliding_window
      pos: rope
      heads: 8
      kv_heads: 2
      window: 64
    - mixer: sliding_window
      pos: rope
      heads: 8
      kv_heads: 2
      window: 64
    - mixer: full_attention
      pos: rope
      heads: 8
      kv_heads: 2
    mlp:
      type: swiglu
      hidden_mult: 4.0
    norm:
      type: rmsnorm
      eps: 1.0e-05
    rope:
      layout: half
      base: 10000.0
    pos: null
    tie_embeddings: true
    scale_residual_init: true
    tier: reference
