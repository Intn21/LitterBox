name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: pyproject.toml
      - run: uv venv
      # CPU-only wheels: CI checks correctness, not speed. Installing torch
      # first means the editable install below resolves it as already satisfied
      # rather than pulling the CUDA build from PyPI.
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e ".[dev]"
      # GPU, slow, and oracle-dependent tests are expected to be run locally on
      # the target hardware.
      - run: .venv/bin/pytest -m "not gpu and not slow and not oracle"
