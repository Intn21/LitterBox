[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litterbox"
version = "0.0.1"
description = "A research sandbox for implementing, swapping, and benchmarking long-context LLM token mixers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Etienne Julia" }]
keywords = ["llm", "attention", "long-context", "transformer", "research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Pins are deliberate: Triton/PyTorch drift is the top source of phantom bugs in
# this space. Record the GPU architecture in every experiment note as well.
dependencies = [
    "torch>=2.4,<3.0",
    "numpy>=1.24",
    "pydantic>=2.6",
    "omegaconf>=2.3",
    "einops>=0.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Test-only oracles. `fla` is a numerical reference for the DeltaNet family, not
# a runtime dependency — nothing under src/ may import it.
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
]
eval = [
    "transformers>=4.44",
    "datasets>=2.20",
    "matplotlib>=3.8",
]
logging = [
    "wandb>=0.17",
    "tensorboard>=2.17",
]
oracles = [
    "flash-linear-attention>=0.1",
]

[project.urls]
Homepage = "https://github.com/Intn21/LitterBox"
Issues = "https://github.com/Intn21/LitterBox/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/litterbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: takes more than a few seconds (training, long-context eval)",
    "gpu: requires a CUDA device",
    "oracle: requires an external reference implementation (fla, transformers)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Ruff reformats Python code blocks inside Markdown. Prose in this repo is
# hand-wrapped for readability, so keep the formatter out of it.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
