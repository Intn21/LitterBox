# Shared optimizer, schedule, and precision settings.
training:
  seed: 1337
  max_steps: 20000
  batch_size: 32
  grad_accum_steps: 1
  seq_len: 2048

  optimizer:
    type: adamw
    lr: 6.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1
    grad_clip: 1.0

  schedule:
    type: cosine
    warmup_steps: 500
    min_lr_ratio: 0.1

  precision:
    dtype: bfloat16
    grad_dtype: float32

data:
  # A data config: the corpus, its tokenizer, and where the packed shards live.
  # Prepared on launch if absent (litterbox.data.prepare). tinystories.yaml is the
  # faster smoke-test option.
  config: configs/data/fineweb-edu-sample.yaml

logging:
  backend: jsonl                 # wandb | tensorboard | jsonl
  log_every: 20
  eval_every: 1000
  checkpoint_every: 2000
