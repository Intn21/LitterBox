# Three sliding-window layers per full-attention layer. The other half of
# Milestone 2's signature: this should recover the retrieval the SWA-only model
# loses, while keeping most of its memory advantage.
model:
  d_model: 768
  n_layers: 12
  vocab_size: 50304
  max_seq_len: 8192
  layer_pattern:                 # tiles to n_layers
    - {mixer: sliding_window, heads: 12, kv_heads: 12, window: 512, pos: rope}
    - {mixer: sliding_window, heads: 12, kv_heads: 12, window: 512, pos: rope}
    - {mixer: sliding_window, heads: 12, kv_heads: 12, window: 512, pos: rope}
    - {mixer: full_attention, heads: 12, kv_heads: 2, pos: rope}
  mlp: {type: swiglu, hidden_mult: 4}
  norm: {type: rmsnorm, eps: 1.0e-5}
  tie_embeddings: true
