# nanoGPT's shakespeare_char model: 6 layers, width 384, 6 heads, 256-token
# context. Same shape here, with this repo's parts (RoPE, SwiGLU, RMSNorm) in
# place of GPT-2's. ~10.8M parameters, almost none of it embedding: the
# character vocabulary is 98 rows, padded to 128.
model:
  d_model: 384
  n_layers: 6
  vocab_size: 128           # char[98], padded to a multiple of 64
  max_seq_len: 256
  layer_pattern:
    - {mixer: full_attention, heads: 6, kv_heads: 6, pos: rope}
  mlp: {type: swiglu, hidden_mult: 4}
  norm: {type: rmsnorm, eps: 1.0e-5}
  tie_embeddings: true
